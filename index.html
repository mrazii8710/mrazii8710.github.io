<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exam Results Lookup - kiic.online</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        input[type="text"], button { padding: 10px; margin: 10px 0; width: 80%; }
        #results-display { margin-top: 20px; text-align: left; padding: 15px; border: 1px solid #007bff; border-radius: 5px; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Check Your Exam Results</h1>
        <input type="text" id="mobileInput" placeholder="Enter Mobile Number" maxlength="10">
        <button onclick="lookupResult()">Check Results</button>
        
        <div id="results-display">
            Enter your 10-digit mobile number above to see your score.
        </div>
    </div>

    <script>
        function lookupResult() {
            const mobile = document.getElementById('mobileInput').value.trim();
            const display = document.getElementById('results-display');
            display.innerHTML = 'Searching...';

            // 1. Fetch the entire JSON data file from the static server
            fetch('results.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Could not load results data.');
                    }
                    return response.json();
                })
                .then(data => {
                    // 2. Look up the result in the loaded array using JavaScript
                    const result = data.find(student => student.mobile === mobile);

                    if (result) {
                        // 3. Display the found result (Beautifully!)
                        display.innerHTML = `
                            <h2>Result for ${result.mobile}</h2>
                            <p><strong>Name:</strong> ${result.name}</p>
                            <p><strong>Score:</strong> <span style="font-size: 1.5em; color: green;">${result.score}</span></p>
                            <p><strong>Grade:</strong> ${result.grade}</p>
                            <p><strong>Remarks:</strong> ${result.details}</p>
                        `;
                    } else {
                        // 4. Handle Not Found
                        display.innerHTML = '<p class="error">Results not found for that mobile number. Please try again.</p>';
                    }
                })
                .catch(error => {
                    display.innerHTML = `<p class="error">An error occurred: ${error.message}</p>`;
                });
        }
    </script>
</body>
</html>
